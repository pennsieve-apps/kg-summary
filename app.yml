# yaml-language-server: $schema=https://schemas.pennsieve.io/app-manifest/v1.json
schemaVersion: "1.0"
application:
  name: KG Summary
  description: >-
    Summarises a dataset's knowledge graph (its metadata records and the ontology terms
    they use, as KGX): size, nodes by category and edges by predicate, the
    category-predicate-category metagraph, connected components and degree distribution,
    hubs, which ontologies the records use and how much, and data-quality flags (dangling
    edges, duplicate ids, empty names, self-loops, categories that aren't Biolink or
    Pennsieve, dropped edges). Writes report.md, report.json, CSV tables and a degree
    histogram.
  type: processor
  tags:
    - knowledge-graph
    - metadata
    - qc
    - ontology
    - kgx
# Sized for Hetionet (92k nodes, 2.3M edges, a 397 MB view): a synthetic graph that size
# takes under 2 s and peaks under 820 MiB at 1 vCPU (README, "Scale").
runtime:
  cpu: 1024
  memory: 2048
  computeTypes: [standard]
  timeoutSeconds: 900
parameters:
  - name: TOP_N
    type: integer
    label: Top hubs and terms
    description: How many of the highest-degree nodes and most-used ontology terms to list.
    defaultValue: 25
    min: 1
    max: 1000
  - name: TOP_PER_CATEGORY
    type: integer
    label: Hubs per category
    description: How many of the highest-degree nodes to list for each category. 0 lists none.
    defaultValue: 5
    min: 0
    max: 100
inputs:
  - name: graph
    description: >-
      A dataset's knowledge graph: link a dataset's graph here (KGX node and edge files,
      Parquet or TSV, with graph.json).
    conformsTo: kgx
    placement: subfolder
    required: true
outputs:
  - name: report
    description: >-
      report.md (the summary), report.json (machine-readable), CSV tables
      (nodes_by_category, edges_by_predicate, metagraph, degree_by_category, hubs, terms)
      and degree_histogram.png.
    mediaTypes:
      - text/markdown
      - application/json
      - text/csv
      - image/png
review:
  version: 1
  inputs:
    graph:
      files: ["tests/fixtures/graph/**"]
      filePaths: source
